# Docker Compose for Hybrid AI Infrastructure
# Ollama + Hugging Face + Supporting Services

version: '3.8'

services:
  # Ollama - Local LLM Server
  ollama:
    image: ollama/ollama:latest
    container_name: notescape-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
      - ./ollama-config:/etc/ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=3
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ai-network

  # Model Downloader - Initialize Ollama models
  ollama-setup:
    image: curlimages/curl:latest
    container_name: notescape-ollama-setup
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
    command: |
      sh -c '
        echo "Pulling Ollama models..."
        curl -X POST http://ollama:11434/api/pull -d "{\"name\":\"llama3.2:1b\"}"
        curl -X POST http://ollama:11434/api/pull -d "{\"name\":\"llama3.2:3b\"}"
        curl -X POST http://ollama:11434/api/pull -d "{\"name\":\"codellama:7b\"}"
        curl -X POST http://ollama:11434/api/pull -d "{\"name\":\"nomic-embed-text\"}"
        echo "Model setup complete"
      '
    networks:
      - ai-network

  # Hugging Face Model Server
  hf-transformers:
    build:
      context: ./docker/huggingface
      dockerfile: Dockerfile
    container_name: notescape-hf-transformers
    ports:
      - "8080:8080"
    volumes:
      - hf_models:/app/models
      - hf_cache:/app/cache
    environment:
      - HF_HOME=/app/cache
      - TRANSFORMERS_CACHE=/app/models
      - HF_DATASETS_OFFLINE=1
      - TOKENIZERS_PARALLELISM=true
      - MAX_WORKERS=4
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ai-network

  # AI Model Manager Service
  ai-manager:
    build:
      context: ./src/services/ai
      dockerfile: Dockerfile.ai-manager
    container_name: notescape-ai-manager
    ports:
      - "3005:3005"
    volumes:
      - ./config/ai-config.json:/app/config/ai-config.json:ro
      - ai_cache:/app/cache
      - ai_logs:/app/logs
    environment:
      - NODE_ENV=production
      - AI_MANAGER_PORT=3005
      - OLLAMA_URL=http://ollama:11434
      - HF_TRANSFORMERS_URL=http://hf-transformers:8080
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ENABLE_LOCAL_MODELS=true
      - ENABLE_CLOUD_FALLBACK=true
      - MAX_CONCURRENT_REQUESTS=10
      - CACHE_TTL=1800
    depends_on:
      ollama:
        condition: service_healthy
      hf-transformers:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ai-network
      - notescape-network

  # Redis for AI Caching
  redis-ai:
    image: redis:7-alpine
    container_name: notescape-redis-ai
    ports:
      - "6380:6379"
    volumes:
      - redis_ai_data:/data
      - ./config/redis-ai.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    environment:
      - REDIS_MAXMEMORY=1gb
      - REDIS_MAXMEMORY_POLICY=allkeys-lru
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ai-network

  # AI Metrics Collector
  ai-metrics:
    image: prom/node-exporter:latest
    container_name: notescape-ai-metrics
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - ai_metrics:/metrics
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.textfile.directory=/metrics'
    restart: unless-stopped
    networks:
      - ai-network

  # GPU Monitoring (if NVIDIA GPU available)
  nvidia-gpu-exporter:
    image: mindprince/nvidia_gpu_prometheus_exporter:latest
    container_name: notescape-gpu-exporter
    ports:
      - "9445:9445"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    profiles: ["gpu"]
    networks:
      - ai-network

volumes:
  ollama_models:
    driver: local
  hf_models:
    driver: local  
  hf_cache:
    driver: local
  ai_cache:
    driver: local
  ai_logs:
    driver: local
  ai_metrics:
    driver: local
  redis_ai_data:
    driver: local

networks:
  ai-network:
    driver: bridge
  notescape-network:
    external: true